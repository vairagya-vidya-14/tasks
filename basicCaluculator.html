<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    function AddTwo(){
            var n1=parseInt(document.getElementById("num1").value);
            var n2=parseInt(document.getElementById("num2").value);
            var sum = n1 + n2;
            document.getElementById("res").value=sum;

            return false;
        }
          function subTwo(){
            var n1=parseInt(document.getElementById("num1").value);
            var n2=parseInt(document.getElementById("num2").value);
            var sub = n1 - n2;
            document.getElementById("res").value=sub;

            return false;
        }
        function mulTwo(){
            var n1=parseInt(document.getElementById("num1").value);
            var n2=parseInt(document.getElementById("num2").value);
            var mul = n1 * n2;
            document.getElementById("res").value=mul;

            return false;
        }
        function divTwo(){
            var n1=parseInt(document.getElementById("num1").value);
            var n2=parseInt(document.getElementById("num2").value);
            var div = n1 / n2;
            document.getElementById("res").value=div;

            return false;
        }
        function expoTwo(){
            var n1=parseInt(document.getElementById("num1").value);
            var n2=parseInt(document.getElementById("num2").value);
            var expo = n1 ** n2;
            document.getElementById("res").value=expo;

            return false;
        }
        function modTwo(){
            var n1=parseInt(document.getElementById("num1").value);
            var n2=parseInt(document.getElementById("num2").value);
            var mod = n1 % n2;
            document.getElementById("res").value=mod;

            return false;
        }

        </script>

</head>
<body>
    <label>Enter Num1:</label>
        <input type="text" placeholder="Enter Number 1" id="num1"><br>

        <label>Enter Num2:</label>
        <input type="text" placeholder="Enter Number 2" id="num2"><br>

        <label>Result :</label>
        <input type="text" id="res" readonly/> <br/>
        <button onclick="AddTwo()">Add</button> <br/>
         <button onclick="subTwo()">Substract</button> 
         <button onclick="mulTwo()">Multiply</button> <br/>
         <button onclick="divTwo()">Division</button> 
         <button onclick="expoTwo()">Exponent</button> <br/>
         <button onclick="modTwo()">Modulus</button> 
</body>
</html>
